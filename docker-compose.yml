services:
  app:
    build: .
    image: trading-agents:latest
    container_name: trading-agents
    restart: unless-stopped
    ports:
      - "7101:7101"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=7101
      - API_RELOAD=false
      - TRADINGAGENTS_DB_PATH=/app/data/tradingagents.db
      - TRADINGAGENTS_RESULTS_DIR=/app/data/logs
      - TRADINGAGENTS_CACHE_DIR=/app/data/cache
      - TRADINGAGENTS_MEMORY_LOG_PATH=/app/data/memory/trading_memory.md
    volumes:
      - trading_data:/app/data
    networks:
      - trading-network

volumes:
  trading_data:
    # Docker will create and manage this volume on the host (Windows or Linux)

networks:
  trading-network:
    driver: bridge
